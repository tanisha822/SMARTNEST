{% extends "base.html" %}
{% block title %}Register — CyberNest{% endblock %}

{% block content %}
<div class="page-wrap">
  <div class="form-wrap">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="width:56px;height:56px;background:var(--accent-dim);border:1.5px solid var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent);margin:0 auto 16px;">
        <i class="bi bi-person-plus"></i>
      </div>
      <h2>Create Account</h2>
      <p class="sub">Join 50,000+ security professionals</p>
    </div>

    {% if error %}
    <div class="alert-dark alert-error">
      <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <div class="input-icon-wrap">
          <i class="bi bi-person input-icon"></i>
          <input type="text" name="username" class="form-control-dark" placeholder="Choose a username" required autocomplete="off"/>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" name="email" class="form-control-dark" placeholder="your@email.com" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" name="password" class="form-control-dark" placeholder="Create a password" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock-fill input-icon"></i>
          <input type="password" name="confirm_password" class="form-control-dark" placeholder="Repeat your password" required/>
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:12px;color:var(--text-2);font-weight:400;">
          <input type="checkbox" style="accent-color:var(--accent);margin-top:2px;" required>
          I agree to the <a href="#" style="color:var(--accent);">Terms of Service</a> and <a href="#" style="color:var(--accent);">Privacy Policy</a>
        </label>
      </div>
      <button type="submit" class="btn-form">
        <i class="bi bi-person-check"></i> Create Account
      </button>
    </form>

    <div class="form-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
